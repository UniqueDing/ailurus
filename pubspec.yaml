name: ailurus
description: "A cross-platform birthdays and anniversaries app with Gregorian and Chinese lunar support."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  google_fonts: ^6.3.1
  lunar: ^1.7.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icons/app_icon_source.png
  android: true
  ios: true
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: true
  macos:
    generate: true

flutter:
  generate: true
  uses-material-design: true

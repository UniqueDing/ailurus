name: ailurus
description: "A cross-platform birthdays and anniversaries app with Gregorian and Chinese lunar support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.1
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  google_fonts: ^6.3.1
  lunar: ^1.7.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
